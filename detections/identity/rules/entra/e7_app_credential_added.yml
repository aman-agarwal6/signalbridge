title: Credential Added to an Entra Application or Service Principal
id: e5094571-0a77-423a-a239-6af4073056ee
name: identity_entra_app_credential_added
status: experimental
description: >
  E7. A client secret, certificate or federated credential was added to an existing app
  registration or service principal. Whoever holds it can sign in as the app with the app's
  permissions, with no user and no MFA, and a password reset does not remove it. An attacker who
  reaches an administrator adds one to keep access. Matches the activity name with either dash
  and with or without its trailing space.
references:
  - https://attack.mitre.org/techniques/T1098/001/
author: Aman Agarwal
date: 2026-10-22
tags:
  - attack.persistence
  - attack.t1098.001
logsource:
  product: azure
  service: auditlogs
detection:
  app_secret_or_certificate:
    OperationName|contains: Certificates and secrets management
  service_principal_credential:
    OperationName: Add service principal credentials
  service_principal_update:
    OperationName: Update service principal
  credential_property:
    TargetResources|contains:
      - FederatedIdentityCredentials
      - KeyDescription
  condition: app_secret_or_certificate or service_principal_credential or (service_principal_update and credential_property)
falsepositives:
  - Planned secret rotation and new deployment pipelines. Check against change records.
level: medium
