title: Entra Sign-in Failed on Password
id: 230ad0d9-51b2-4172-96c1-d6660e6cbe97
name: identity_entra_failed_password
status: experimental
description: >
  An interactive Entra sign-in that failed on the password (50126) or on smart lockout (50053).
  Input to E1.
author: Aman Agarwal
date: 2026-10-22
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    ResultType:
      - 50126
      - 50053
  condition: selection
falsepositives:
  - Expected on its own; only the correlation raises an alert.
level: informational
---
title: Password Spray - One Address Fails for Many Entra Accounts
id: 4f037d4f-561c-4adc-858c-0e2bab1a699e
name: identity_entra_password_spray
status: experimental
description: >
  E1. One IP address fails the password for ten or more distinct Entra accounts within ten
  minutes. A spray spread across many addresses stays under this rule; Entra ID Protection's
  password spray detection or a per-tenant failure baseline covers that case.
references:
  - https://attack.mitre.org/techniques/T1110/003/
  - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
author: Aman Agarwal
date: 2026-10-22
tags:
  - attack.credential-access
  - attack.t1110.003
correlation:
  type: value_count
  rules:
    - identity_entra_failed_password
  group-by:
    - IPAddress
  timespan: 10m
  condition:
    field: UserPrincipalName
    gte: 10
falsepositives:
  - Many users behind one corporate NAT address after a forced password change.
level: high
