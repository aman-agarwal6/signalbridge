title: Failed NTLM Credential Validation
id: a4b08a76-3b3e-4583-98e8-24d8097c9c3a
name: identity_windows_failed_ntlm_validation
status: experimental
description: >
  A domain controller refused an NTLM credential check (4776 with a non-zero status). Input to
  W5.
author: Aman Agarwal
date: 2026-10-22
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4776
  validated:
    Status: '0x0'
  condition: selection and not validated
falsepositives:
  - Expected on its own; only the correlation raises an alert.
level: informational
---
title: Password Spray - One Workstation Fails NTLM for Many Accounts
id: ea3681d1-987a-48fb-a585-58032e8619b8
name: identity_windows_ntlm_password_spray
status: experimental
description: >
  W5. The domain controller refuses NTLM credentials for ten or more distinct accounts from one
  workstation within ten minutes. NTLM checks (4776) name the workstation, not an IP address, so
  W2 cannot group them. Added after the first scoring run, which showed a spray visible only as
  NTLM checks.
references:
  - https://attack.mitre.org/techniques/T1110/003/
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4776
author: Aman Agarwal
date: 2026-10-22
tags:
  - attack.credential-access
  - attack.t1110.003
correlation:
  type: value_count
  rules:
    - identity_windows_failed_ntlm_validation
  group-by:
    - Computer
    - Workstation
  timespan: 10m
  condition:
    field: TargetUserName
    gte: 10
falsepositives:
  - A shared workstation or terminal server where many users mistype passwords.
level: high
