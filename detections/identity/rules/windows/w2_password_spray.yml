title: Windows Failed Authentication
id: 5699f109-5851-4d61-821e-2e5736fa12fc
name: identity_windows_failed_authentication
status: experimental
description: >
  A failed logon (4625), a failed Kerberos pre-authentication (4771) or a refused Kerberos TGT
  request (4768 with a non-zero status). Input to W2.
author: Aman Agarwal
date: 2026-10-22
logsource:
  product: windows
  service: security
detection:
  failed_logon:
    EventID:
      - 4625
      - 4771
  tgt_request:
    EventID: 4768
  tgt_issued:
    Status: '0x0'
  condition: failed_logon or (tgt_request and not tgt_issued)
falsepositives:
  - Expected on its own; only the correlation raises an alert.
level: informational
---
title: Password Spray - One Source Fails for Many Windows Accounts
id: e6fa64c7-9717-427a-9d65-51dcca41be6e
name: identity_windows_password_spray
status: experimental
description: >
  W2. One source address, seen by one computer, fails to authenticate as ten or more distinct
  accounts within ten minutes. A spray tries one or two passwords across many accounts to stay
  under per-account lockout.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Aman Agarwal
date: 2026-10-22
tags:
  - attack.credential-access
  - attack.t1110.003
correlation:
  type: value_count
  rules:
    - identity_windows_failed_authentication
  group-by:
    - Computer
    - IpAddress
  timespan: 10m
  condition:
    field: TargetUserName
    gte: 10
falsepositives:
  - A shared host such as a terminal server or VPN concentrator where many users mistype passwords.
  - A misconfigured service retrying stale credentials for several accounts.
level: high
