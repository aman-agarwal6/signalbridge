title: SignalBridge Private Read Denied or Not Visible
id: 9f89e5bb-549e-4042-9c4e-6b551295a12d
name: signalbridge_private_read_failed
status: test
description: A private-record read that the source app denied or reported as not visible. Input to R1.
references:
  - https://github.com/aman-agarwal6/signalbridge/blob/main/bridge/contract.py
author: Aman Agarwal
date: 2026-10-05
logsource:
  product: signalbridge
  service: access_telemetry
detection:
  selection:
    operation: private_record.read
    outcome:
      - denied
      - not_visible
  condition: selection
falsepositives:
  - Expected on its own; only the correlation rules raise alerts.
level: informational
