title: Private-Resource Denials Across Accounts
id: 79da3cfc-8826-4564-bdd6-05789e6e6e90
name: signalbridge_r5
status: test
description: >
  At least six denied reads by at least three accounts target the same private record within ten
  minutes, in one app, environment and source. Sigma version of SignalBridge rule R5
  (bounded-denials-v1), built by chaining the two halves above.
references:
  - https://github.com/aman-agarwal6/signalbridge/blob/main/bridge/engine.py
author: Aman Agarwal
date: 2026-10-05
tags:
  - attack.collection
  - attack.t1213
correlation:
  type: temporal
  rules:
    - signalbridge_r5_denials
    - signalbridge_r5_accounts
  group-by:
    - app
    - environment
    - source
    - resource
  timespan: 10m
falsepositives:
  - A shared stale link, a legitimate permission change, or approved testing.
level: medium
