title: SignalBridge Resource Membership Removed
id: d8dc7428-393e-44fa-a55c-8e3fc0194c1b
name: signalbridge_membership_removed
status: test
description: >
  A schema-v2 assertion that an account was removed from one resource. The actor is the operator;
  membership.subject is the removed account. First step of R3.
references:
  - https://github.com/aman-agarwal6/signalbridge/blob/main/bridge/contract.py
author: Aman Agarwal
date: 2026-10-05
logsource:
  product: signalbridge
  service: access_telemetry
detection:
  selection:
    operation: membership.change
    membership.state: removed
  condition: selection
falsepositives:
  - Expected on its own; only the correlation rules raise alerts.
level: informational
