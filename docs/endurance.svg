<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" width="960" height="512" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Continuous run: reads per ten minutes and worst delivery delay per minute over 13.5 hours">
<rect width="960" height="512" fill="#ffffff"/>
<text x="70" y="26" font-size="17" font-weight="600" fill="#1f2933">Continuous run: 27,118 reads delivered over 13.5 hours</text>
<text x="70" y="48" font-size="12.5" fill="#52606d">Delivery delay = source read to accepted by SignalBridge. p95 175 ms. The two tall spikes are planned outages, fully recovered.</text>
<text x="70" y="66" font-size="12.5" fill="#52606d">Outside the planned windows the worst delay was 9.7 s (2.2% of reads over 1 s). Every read was delivered.</text>
