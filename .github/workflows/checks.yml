name: SignalBridge core checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SB_MODE: local
      SB_SECRET_KEY: ephemeral-ci-only-do-not-use-outside-this-disposable-job-123456789
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned Python runtime and verification tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python source
        run: python -m ruff check bridge reference_lab config tests scripts simulations manage.py
      - name: Check Python formatting
        run: python -m ruff format --check bridge reference_lab config tests scripts simulations manage.py
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Test Django against disposable SQLite (the supported local database)
        run: python manage.py test tests --exclude-tag offline_simulation --exclude-tag native_postgres --verbosity 1
      - name: Test simulation fault handling against memory-only SQLite
        run: python manage.py test tests --tag offline_simulation --settings config.simulation_settings --verbosity 1
      - name: Test reference application authorization and transactional telemetry in memory
        run: python manage.py test reference_lab --settings config.reference_verification_settings --verbosity 1
      - name: Measure historical R1/R2 challenge contracts (new rules evaluated separately)
        run: python scripts/run_enterprise_lab.py --challenge
      - name: Execute the separately frozen enterprise detection round
        run: python scripts/evaluate_enterprise_detection.py
      - name: Test offline event courier
        run: node --test --test-isolation=none --test-reporter=tap integrations/sender.test.mjs
      - name: Test offline HTTP-harness behavior
        run: node --test --test-isolation=none --test-reporter=tap integrations/supabase-http.test.mjs
      - name: Test offline application-route and recovery behavior
        run: node --test --test-isolation=none --test-reporter=tap integrations/bettail-routes.test.mjs
      - name: Check publishable paths and known job-local credential copies
        run: python scripts/check_publication.py
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: python@sha256:7bf6c3111fe094f8ee1a1cbcdc63c4cfb345b0e3df42d5aa9a90b3b4b022ab6d
      # Match the hosted runner UID for its owner-only command files. Keep
      # capabilities dropped; do not grant root a file-permission bypass.
      options: >-
        --user=1001:1001 --memory=1g --cpus=2 --pids-limit=256
        --cap-drop=ALL --security-opt=no-new-privileges
        --tmpfs=/run/secrets:rw,noexec,nosuid,nodev,size=1m,uid=1001,gid=1001,mode=0700
    services:
      database:
        image: postgres@sha256:e31e3d5327d1806f6177827c9710643e4f35f7ab3f14d26d05332753d3e95ee0
        env:
          # Public, job-only bootstrap fixture. It is never a workstation secret.
          POSTGRES_PASSWORD: disposable-ci-bootstrap-only-never-use-on-a-workstation-123456789
        options: >-
          --memory=512m --cpus=1 --pids-limit=128
          --user=postgres --cap-drop=ALL --security-opt=no-new-privileges
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=3s --health-retries=12
    env:
      SB_CI_POSTGRES_PROFILE: signalbridge-enterprise-ci-v1
      SB_CI_BOOTSTRAP_PASSWORD: disposable-ci-bootstrap-only-never-use-on-a-workstation-123456789
      SB_DISPOSABLE_PG: '1'
      SB_SECRET_KEY: ephemeral-ci-only-do-not-use-outside-this-disposable-job-123456789
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Verify the hosted runner ownership contract before checkout
        run: >-
          python -c 'import os, pathlib; assert os.getuid() == 1001;
          assert pathlib.Path(os.environ["GITHUB_STATE"]).stat().st_uid == os.getuid(),
          "Hosted runner UID changed; review the non-root CI profile"'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install the six hash-pinned verification dependencies
        run: |
          python -m venv "$RUNNER_TEMP/sb-verifier"
          "$RUNNER_TEMP/sb-verifier/bin/python" -m pip install --no-cache-dir --no-deps --no-compile --require-hashes -r integrations/enterprise/runner-requirements.lock
      - name: Prepare the fresh non-superuser database
        run: '"$RUNNER_TEMP/sb-verifier/bin/python" -B scripts/ci_postgresql.py'
      - name: Verify native concurrency and actual process-kill recovery
        # The fixed child probe runs from integrations/enterprise. Give it only
        # this checked-out source path; dependencies stay in the same venv.
        run: 'PYTHONPATH="$GITHUB_WORKSPACE" "$RUNNER_TEMP/sb-verifier/bin/python" -B manage.py test tests.test_postgres_processing tests.test_postgres_cases --settings config.in_network_postgres_settings --noinput --verbosity 1'
# The sibling app repositories are not bundled or cloned. Their integration checks
# require an explicitly approved source checkout. This is not full M1 coverage.
# The Node suites use built-ins and mocked services, so no npm/PGlite install is needed.
# The publication check cannot match private workstation credentials absent from CI.
# No repository secrets, deployment writes, pull_request_target or native SOC labs.
# Native PostgreSQL checks are a separate required gate; this SQLite job excludes them.
# Retained September evaluation integrity is checked by the Python suite. Re-running
# its engine on changed source is rejected. A new frozen enterprise evaluation and
# disposable PostgreSQL job are now declared. Its hosted UID guard fails closed
# if runner ownership changes. Local native receipts are separate from CI results.
