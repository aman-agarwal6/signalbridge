name: SignalBridge core checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: signalbridge
          POSTGRES_USER: signalbridge
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U signalbridge"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SB_MODE: local
      SB_SECRET_KEY: ephemeral-ci-only-do-not-use-outside-this-disposable-job-123456789
      SB_DB_HOST: 127.0.0.1
      SB_DB_USER: signalbridge
      SB_DB_PASSWORD: ephemeral-ci-only
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned Python runtime and verification tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python source
        run: python -m ruff check bridge config tests scripts simulations manage.py
      - name: Check Python formatting
        run: python -m ruff format --check bridge config tests scripts simulations manage.py
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Test Django against disposable PostgreSQL
        run: python manage.py test tests --exclude-tag offline_simulation --verbosity 1
      - name: Test simulation fault handling against memory-only SQLite
        run: python manage.py test tests --tag offline_simulation --settings config.simulation_settings --verbosity 1
      - name: Measure the fixed offline detection challenge
        run: python scripts/run_enterprise_lab.py --challenge
      - name: Test offline event courier
        run: node --test --test-isolation=none --test-reporter=tap integrations/sender.test.mjs
      - name: Test offline HTTP-harness behavior
        run: node --test --test-isolation=none --test-reporter=tap integrations/supabase-http.test.mjs
      - name: Test offline application-route and recovery behavior
        run: node --test --test-isolation=none --test-reporter=tap integrations/bettail-routes.test.mjs
      - name: Check publishable paths and known job-local credential copies
        run: python scripts/check_publication.py
# The sibling app repositories are not bundled or cloned. Their integration checks
# require an explicitly approved source checkout. This is not full M1 coverage.
# The Node suites use built-ins and mocked services, so no npm/PGlite install is needed.
# The publication check cannot match private workstation credentials absent from CI.
