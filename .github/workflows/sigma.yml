name: Sigma detections
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - detections/**
      - bridge/engine.py
      - bridge/contract.py
      - fixtures/enterprise_detection_evaluation/round-20261005-public-release/**
      - docs/evidence/20261005-enterprise-detection-evaluation-public-release.json
      - scripts/evaluate_enterprise_detection.py
      - scripts/evaluate_detection.py
      - scripts/run_enterprise_lab.py
      - .github/workflows/sigma.yml
  pull_request:
    paths:
      - detections/**
      - bridge/engine.py
      - bridge/contract.py
      - fixtures/enterprise_detection_evaluation/round-20261005-public-release/**
      - docs/evidence/20261005-enterprise-detection-evaluation-public-release.json
      - scripts/evaluate_enterprise_detection.py
      - scripts/evaluate_detection.py
      - scripts/run_enterprise_lab.py
      - .github/workflows/sigma.yml
concurrency:
  group: sigma-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  sigma:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Install pinned Sigma tooling
        run: python -m pip install --require-hashes --only-binary ":all:" -r detections/requirements.txt
      - name: Lint and format
        run: |
          python -m ruff check detections
          python -m ruff format --check detections
      - name: Compiled queries and replay report are current
        run: |
          python -m detections.sigma.compile --check
          python -m detections.sigma.replay --check
      - name: Tests
        run: python -m unittest discover -s detections -t . -p "test_*.py" -v
