# Disposable local lab. Never link this project to a hosted Supabase project.
project_id = "signalbridge-bettail-lab"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.migrations]
enabled = false

[db.seed]
enabled = false

[db.pooler]
enabled = false

# Keep schema bootstrap; exclude the long-running Realtime service at startup.
[realtime]
enabled = true

[studio]
enabled = false

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "25MiB"

[storage.image_transformation]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3101"
additional_redirect_urls = ["http://127.0.0.1:3101/auth/callback", "http://127.0.0.1:3101/auth/confirm"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 14
signing_keys_path = "./signing_keys.json"

[auth.email]
enable_signup = true
enable_confirmations = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
