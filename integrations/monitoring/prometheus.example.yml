# Preparation only. This reserved .invalid target must be replaced in a reviewed
# isolated launch profile. No service, network, credential or host trust is created.
global:
  scrape_interval: 15s
  scrape_timeout: 7s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/signalbridge-alerts.yml
scrape_configs:
  - job_name: signalbridge
    scheme: https
    metrics_path: /metrics/
    scrape_protocols: [PrometheusText0.0.4]
    follow_redirects: false
    proxy_from_environment: false
    enable_http2: false
    authorization:
      type: Bearer
      credentials_file: /run/secrets/signalbridge-metrics-token
    tls_config:
      ca_file: /run/secrets/signalbridge-metrics-ca.crt
      min_version: TLS12
      insecure_skip_verify: false
    sample_limit: 256
    label_limit: 8
    label_name_length_limit: 64
    label_value_length_limit: 128
    body_size_limit: 64KB
    static_configs:
      - targets: ['signalbridge-metrics.invalid:8741']
# No remote_write, service discovery, external notifications or Alertmanager.
