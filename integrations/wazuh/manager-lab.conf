<!-- Complete configuration for the bounded, manager-only SignalBridge experiment.
     Runtime isolation and service selection are separate required controls. -->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>no</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <update_check>no</update_check>
    <rotate_interval>10m</rotate_interval>
    <max_output_size>5M</max_output_size>
  </global>
  <alerts>
    <log_alert_level>3</log_alert_level>
  </alerts>
  <logging>
    <log_format>plain</log_format>
  </logging>
  <active-response><disabled>yes</disabled></active-response>
  <auth><disabled>yes</disabled></auth>
  <cluster><disabled>yes</disabled></cluster>
  <rootcheck><disabled>yes</disabled></rootcheck>
  <syscheck><disabled>yes</disabled></syscheck>
  <sca><enabled>no</enabled></sca>
  <wodle name="syscollector"><disabled>yes</disabled></wodle>
  <wodle name="osquery"><disabled>yes</disabled></wodle>
  <wodle name="docker-listener"><disabled>yes</disabled></wodle>
  <vulnerability-detection><enabled>no</enabled></vulnerability-detection>
  <indexer><enabled>no</enabled></indexer>
  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_include>etc/rules/signalbridge_rules.xml</rule_include>
  </ruleset>
  <localfile>
    <location>/signalbridge/input/events.jsonl</location>
    <log_format>json</log_format>
    <only-future-events>yes</only-future-events>
  </localfile>
</ossec_config>
