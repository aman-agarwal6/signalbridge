# Paced 24-hour reliability profile; launch only through scripts/enterprise_reliability_verify.py.
name: sb-enterprise-reference
services:
  database:
    image: ${SB_SOURCE_DB_IMAGE:?An already installed reviewed PostgreSQL image is required}
    pull_policy: never
    restart: "no"
    user: postgres
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 128
    shm_size: 64m
    read_only: true
    cgroup: private
    ipc: private
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    labels:
      org.signalbridge.enterprise.run: ${SB_SOURCE_RUN:?A unique source run identity is required}
      org.signalbridge.enterprise.scope: reference-access-verification
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=20, -c, log_statement=none]
    secrets: [bootstrap_password, source_password, console_password]
    volumes:
      - reference_data:/var/lib/postgresql/data
      - ${SB_SOURCE_RUN_DIR:?A verified private source run is required}/source/integrations/enterprise/init-reference.sh:/docker-entrypoint-initdb.d/10-reference.sh:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m
    networks: [reference]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
    healthcheck:
      test: [CMD, pg_isready, -h, "127.0.0.1", -U, postgres, -d, postgres]
      interval: 2s
      timeout: 2s
      retries: 30
  runner:
    image: ${SB_SOURCE_PYTHON_IMAGE:?An already installed reviewed Python image is required}
    pull_policy: never
    restart: "no"
    user: "10001:10001"
    # Seven supervised processes: source, console, courier, two workers, SOC publisher, workload.
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 2
    pids_limit: 256
    read_only: true
    cgroup: private
    ipc: private
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    labels:
      org.signalbridge.enterprise.run: ${SB_SOURCE_RUN}
      org.signalbridge.enterprise.scope: reference-access-verification
    environment:
      SB_SOURCE_PROOF: "1"
      SB_SOURCE_RUN: ${SB_SOURCE_RUN}
      SB_RELIABILITY_RUNTIME: "1"
      SB_RELIABILITY_REHEARSAL_MS: ${SB_RELIABILITY_REHEARSAL_MS:?Explicit rehearsal length or 0 is required}
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_CONFIG_FILE: /dev/null
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    working_dir: /workspace
    command: [python, -B, -m, integrations.enterprise.reliability_runner]
    depends_on:
      database: {condition: service_healthy}
    secrets: [source_password, console_password, source_profile, lab_ca, source_certificate, source_private_key, console_certificate, console_private_key]
    volumes:
      - ${SB_SOURCE_RUN_DIR}/source:/workspace:ro
      - ${SB_SOURCE_RUN_DIR}/wheels:/wheels:ro
      - ${SB_SOURCE_RUN_DIR}/evidence:/evidence:rw
      - ${SB_SOURCE_RUN_DIR}/clock:/clock:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /opt/verification-deps:rw,exec,nosuid,nodev,size=128m,mode=0700,uid=10001,gid=10001
    networks: [reference]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  # Reviewed networkless Wazuh manager profile; tails only the two live stream directories.
  wazuh:
    image: ${SB_WAZUH_IMAGE:?The already installed reviewed Wazuh manager image is required}
    pull_policy: never
    restart: "no"
    user: "0:0"
    init: true
    hostname: sb-wazuh-lab
    network_mode: none
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1
    pids_limit: 256
    shm_size: 16m
    cgroup: private
    ipc: private
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, SYS_CHROOT]
    labels:
      org.signalbridge.enterprise.run: ${SB_SOURCE_RUN}
      org.signalbridge.enterprise.scope: reference-access-verification
    environment:
      SB_WAZUH_ENTERPRISE_RUN: ${SB_WAZUH_RUN:?The hyphenated run identity is required}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    working_dir: /workspace
    entrypoint: [/var/ossec/framework/python/bin/python3]
    command: [-B, -m, integrations.wazuh_enterprise.native_continuous_collector]
    volumes:
      - ${SB_SOURCE_RUN_DIR}/source:/workspace:ro
      - ${SB_SOURCE_RUN_DIR}/wazuh/evidence:/evidence:rw
      - ${SB_SOURCE_RUN_DIR}/clock:/signalbridge/clock:ro
      - ${SB_SOURCE_RUN_DIR}/evidence/soc-delivery/enterprise/documents/observation/${SB_RELIABILITY_DOCUMENTS_STREAM:?}:/signalbridge/input/documents/observation:ro
      - ${SB_SOURCE_RUN_DIR}/wazuh/idle/documents/detection:/signalbridge/input/documents/detection:ro
      - ${SB_SOURCE_RUN_DIR}/evidence/soc-delivery/enterprise/expenses/observation/${SB_RELIABILITY_EXPENSES_STREAM:?}:/signalbridge/input/expenses/observation:ro
      - ${SB_SOURCE_RUN_DIR}/wazuh/idle/expenses/detection:/signalbridge/input/expenses/detection:ro
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: "2"}
secrets:
  bootstrap_password: {file: "${SB_SOURCE_RUN_DIR}/secrets/bootstrap-password"}
  source_password: {file: "${SB_SOURCE_RUN_DIR}/secrets/source-password"}
  console_password: {file: "${SB_SOURCE_RUN_DIR}/secrets/console-password"}
  source_profile: {file: "${SB_SOURCE_RUN_DIR}/secrets/source-profile"}
  lab_ca: {file: "${SB_SOURCE_RUN_DIR}/secrets/lab-ca.pem"}
  source_certificate: {file: "${SB_SOURCE_RUN_DIR}/secrets/source-certificate.pem"}
  source_private_key: {file: "${SB_SOURCE_RUN_DIR}/secrets/source-private-key.pem"}
  console_certificate: {file: "${SB_SOURCE_RUN_DIR}/secrets/console-certificate.pem"}
  console_private_key: {file: "${SB_SOURCE_RUN_DIR}/secrets/console-private-key.pem"}
volumes:
  reference_data:
    name: sb-enterprise-reference-${SB_SOURCE_RUN}
    labels:
      org.signalbridge.enterprise.run: ${SB_SOURCE_RUN}
      org.signalbridge.enterprise.scope: reference-access-verification
networks:
  reference:
    name: sb-enterprise-reference-internal-${SB_SOURCE_RUN}
    internal: true
    # Explicit run-derived range; the default address pools may be exhausted.
    ipam:
      config:
        - subnet: ${SB_RELIABILITY_SUBNET:?The run-derived lab subnet is required}
    labels:
      org.signalbridge.enterprise.run: ${SB_SOURCE_RUN}
      org.signalbridge.enterprise.scope: reference-access-verification
